###############################################################################
#  DarkAdmin  —  a WeeWX 5.x skin styled after PrepBootstrap's Dark Admin theme
#
#  Charts are rendered client-side by Chart.js from JSON emitted by the
#  CheetahGenerator (see the [[[data_*]]] blocks below), so there is no
#  ImageGenerator here.  PNG plots carry a baked-in background color that
#  fights the dark surface; canvas charts inherit the page palette instead.
###############################################################################

SKIN_NAME = DarkAdmin
SKIN_VERSION = 1.2.0

###############################################################################

[Extras]

    # Shown as the navbar brand, top-left.
    brand = Weather

    # The radio is considered out once nothing has been heard from the sensor
    # for this many seconds. Every page then shows a warning banner, and the
    # current readings switch to Weather Underground's copy if there is one
    # (data/wu.json, see the README). 600 = 10 minutes.
    outage_seconds = 600

    # How often an open page looks for new values in data/live.json, which
    # bin/user/darkadminlive.py rewrites on every packet. The sensor sends
    # wind speed every 10 seconds and everything else every 30, so asking much
    # more often than this shows nothing new. 0 turns it off.
    live_seconds = 5

    # How often an open page checks whether WeeWX has generated it again, and
    # if so takes over the new highs, lows, tables and charts without a
    # reload. 0 turns it off.
    refresh_seconds = 30

###############################################################################

[DisplayOptions]

    # Observations listed in the "Current readings" table on the Station page.
    # Anything the station does not produce is skipped automatically. The
    # dashboard's four stat cards are fixed in index.html.tmpl, not read from
    # this list.
    observations_current = outTemp, outHumidity, windSpeed, windGust, barometer, rain, UV, luminosity

    # Observations given a row in the highs-and-lows tables (dashboard, week,
    # month, year) and in the Records table. The charts are fixed in the
    # templates, not read from this list.
    observations_period = outTemp, outHumidity, windSpeed, barometer

###############################################################################

[Units]

    [[StringFormats]]
        # Rendered wherever a value is missing. With the station offline this
        # is most of them, so it must read as "no data", not as a broken page.
        NONE = N/A

        # A pressure taken from Weather Underground comes to two decimals;
        # WeeWX's default of three prints a zero that was never measured.
        inHg = %.2f

        # Temperatures as whole numbers, wherever one is printed: dew point,
        # heat index and wind chill as well as the temperature itself. Wind
        # in mph, km/h and knots is whole by WeeWX's own default; m/s is not.
        # A chart prints a value the same way when one is read off it, but
        # draws its line from the figures as measured. Rain keeps its decimals.
        degree_F = %.0f
        degree_C = %.0f
        meter_per_second = %.0f

###############################################################################

[Labels]

    [[Generic]]
        outTemp        = Temperature
        inTemp         = Inside Temperature
        outHumidity    = Humidity
        inHumidity     = Inside Humidity
        barometer      = Barometer
        pressure       = Pressure
        windSpeed      = Wind Speed
        windGust       = Wind Gust
        windDir        = Wind Direction
        rain           = Rain
        rainRate       = Rain Rate
        dewpoint       = Dew Point
        heatindex      = Heat Index
        windchill      = Wind Chill
        UV             = UV Index
        luminosity     = Luminosity
        radiation      = Solar Radiation
        lightning_strike_count = Lightning Strikes
        lightning_distance     = Last Strike
        outTempBatteryStatus = Sensor Battery

        # Reception, on the Station page. These three are whatever weewx.conf's
        # sensor map sends to them; the station installer sends rtl_433's rssi,
        # snr and noise (README, "Reception").
        signal1        = Signal Level
        signal2        = Signal-to-Noise
        noise          = Noise Floor

###############################################################################

[CheetahGenerator]

    encoding = html_entities

    [[ToDate]]

        [[[index]]]
            template = index.html.tmpl

        [[[week]]]
            template = week.html.tmpl

        [[[month]]]
            template = month.html.tmpl

        [[[year]]]
            template = year.html.tmpl

        [[[records]]]
            template = records.html.tmpl

        [[[station]]]
            template = station.html.tmpl

        # ---- chart data -----------------------------------------------------
        # utf8, not html_entities: entity-escaping would corrupt the JSON.

        [[[data_day]]]
            template = data/day.json.tmpl
            encoding = utf8

        [[[data_week]]]
            template = data/week.json.tmpl
            encoding = utf8
            stale_age = 3600   # rebuild hourly

        [[[data_month]]]
            template = data/month.json.tmpl
            encoding = utf8
            stale_age = 10800   # rebuild every 3 hours

        [[[data_year]]]
            template = data/year.json.tmpl
            encoding = utf8
            stale_age = 43200   # rebuild twice a day

###############################################################################

[CopyGenerator]

    # vendor/ is ~870 KB of third-party libraries that never change between
    # report cycles, so it is copied once. Listed explicitly rather than with a
    # recursive glob, which CopyGenerator does not expand.
    copy_once = vendor/bootstrap/css/*, vendor/bootstrap/js/*, vendor/chartjs/*, vendor/fontawesome/css/*, vendor/fontawesome/webfonts/*

    # css/ and js/ are this skin's own, they are tens of KB, and they DO change
    # whenever the skin is edited. Under copy_once an edit silently never
    # reaches the served page -- you fix the stylesheet, reinstall, regenerate,
    # and the browser still gets the old one.
    copy_always = css/*, js/*

###############################################################################

[Generators]

    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
